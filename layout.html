<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #ffffff;
    color: #000000;
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 40px 20px;
    position: relative;
  }

  /* Top Right Human Silhouette Icon */
  .user-account-icon {
    position: fixed;
    top: 35px;
    right: 50px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    transition: opacity 0.2s ease;
    z-index: 100;
  }

  .user-account-icon:hover {
    opacity: 0.6;
  }

  .user-account-icon svg {
    width: 24px;
    height: 24px;
    fill: #000000;
  }

  /* Top Left Logo (Fixed position so it stays pinned) */
  .logo {
    position: fixed;
    top: 40px;
    left: 40px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    font-size: 26px;
    color: #000000;
    text-decoration: none;
    z-index: 100;
  }

  /* Centered Main Layout Shell */
  .site-wrapper {
    width: 100%;
    display: flex;
    justify-content: center; /* Centers the post column in dead center */
    align-items: flex-start;
    padding: 0 20px;
  }

  .content-left {
    max-width: 580px;
    width: 100%;
  }

  /* Fixed Right Directory Menu */
  aside {
    position: fixed;
    right: 60px;
    top: 250px;
    width: 140px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
  }

  .nav-list {
    list-style: none;
    margin-bottom: 30px;
  }

  .nav-list li {
    margin-bottom: 6px;
  }

  .nav-list a {
    color: #000000;
    text-decoration: underline;
  }

  .nav-list a:hover {
    background-color: #ffff00;
  }

  .author-key {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 10px;
    color: #555555;
    line-height: 1.4;
  }

  .author-key li {
    margin-bottom: 4px;
  }

  .author-key a {
    color: #555555;
    text-decoration: none;
  }

  .author-key a:hover {
    text-decoration: underline;
  }

  /* Mobile Responsiveness */
  @media (max-width: 768px) {
    body {
      padding: 20px 15px;
    }

    .logo {
      position: static;
      display: block;
      margin-bottom: 25px;
    }

    .user-account-icon {
      position: absolute;
      top: 15px;
      right: 15px;
    }

    .site-wrapper {
      flex-direction: column;
      align-items: center;
      padding: 0;
    }

    .content-left {
      max-width: 100%;
    }

    aside {
      position: static;
      width: 100%;
      margin-top: 30px;
    }
  }
</style>

<!-- Top Left Logo -->
<a href="index.html" class="logo">faapd</a>

<!-- Top Right Silhouette Icon -->
<a id="account-icon-btn" class="user-account-icon">
  <svg viewBox="0 0 24 24">
    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
  </svg>
</a>

<div class="site-wrapper">
  <div class="content-left">
    <!-- Main page content gets inserted here dynamically -->
    <main id="main-content"></main>
  </div>

  <!-- Right Side Directory -->
  <aside>
    <ul class="nav-list">
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="games.html">GAMES</a></li>
    </ul>

    <ul class="author-key">
      <li><a href="franklinabboud.html">Franklin Abboud</a></li>
      <li><a href="patrickdaughety.html">Patrick Daughety</a></li>
    </ul>
  </aside>
</div>

  document.title = 'faapd';
</script>
