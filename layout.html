  .site-wrapper {

  .content-left {

  aside {

  }

  @media (max-width: 768px) {
    body {
      padding: 20px 15px;
    }

    .logo {
      position: static;
      display: block;
      margin-bottom: 25px;
    }

    .site-wrapper {
      flex-direction: column;
      align-items: center;
      padding: 0;
    }
