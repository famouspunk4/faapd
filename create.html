<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
    }

    /* Outer wrapper identical to index.html and post.html */
    .site-wrapper {
      max-width: 100%;
      padding: 0 40px;
    }

    /* Logo positioned identically to index.html and post.html */
    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      display: inline-block;
    }

    /* Centered form container pulled up level with top layout */
    .form-container {
      max-width: 580px;
      margin: 60px auto 0 auto;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 15px;
      font-family: Arial, Helvetica, sans-serif;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="password"],
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      font-size: 12px;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
    }

    input[type="file"]::file-selector-button {
      color: #000000 !important;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      padding: 4px 8px;
      cursor: pointer;
    }

    button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="site-wrapper">
    <!-- Logo placed in top-left position -->
    <a href="index.html" class="logo">faapd</a>

    <!-- Centered Form -->
    <div class="form-container">
      <form id="post-form">
        <div class="form-group">
          <label for="github-token">GitHub Token</label>
          <input type="password" id="github-token" placeholder="Paste your Fine-Grained PAT here" required>
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <input type="text" id="author" value="FRANKLIN ABBOUD" required>
        </div>

        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" required>
        </div>

        <div class="form-group">
          <label for="image-file">Upload Image</label>
          <input type="file" id="image-file" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="text">Text Content</label>
          <textarea id="text" rows="5" required></textarea>
        </div>

        <button type="submit" id="submit-btn">Publish Post</button>
      </form>

      <div id="status"></div>
    </div>
  </div>

  <script>
    // Load saved token from localStorage if available
    document.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem('gh_token');
      if (savedToken) {
        document.getElementById('github-token').value = savedToken;
      }
    });

    // Helper function to turn strings into clean URL filenames
    function slugify(text) {
      return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/\s+/g, '-')        // Replace spaces with -
        .replace(/[^\w\-]+/g, '')    // Remove non-word characters
        .replace(/\-\-+/g, '-');      // Replace multiple - with single -
    }

    // Helper function to format timestamp as MM.DD.YY @ HH:MM:SS
    function getExactFormattedTimestamp() {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const yy = String(now.getFullYear()).slice(-2);
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${mm}.${dd}.${yy} @ ${hh}:${min}:${ss}`;
    }

    document.getElementById('post-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      let rawToken = document.getElementById('github-token').value;
      const token = rawToken.replace(/[^\x20-\x7E]/g, "").trim();

      const author = document.getElementById('author').value.trim().toUpperCase();
      const title = document.getElementById('title').value.trim().toUpperCase();
      const text = document.getElementById('text').value.trim();
      const fileInput = document.getElementById('image-file');
      const file = fileInput.files[0];
      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');

      if (!token) {
        alert("Please enter a valid GitHub Access Token.");
        return;
      }

      localStorage.setItem('gh_token', token);

      if (!file) {
        alert("Please select an image file.");
        return;
      }

      statusDiv.style.color = "#000000";
      statusDiv.textContent = "Publishing to GitHub...";
      submitBtn.disabled = true;

      const reader = new FileReader();
      reader.onload = async function(event) {
        const base64ImageData = event.target.result;
        const exactTimestamp = getExactFormattedTimestamp();

        // Generates full post structure matching post.html
        const postHtmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title} - faapd</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #ffffff; color: #000000; font-family: Georgia, "Times New Roman", Times, serif; font-size: 13px; line-height: 1.5; padding: 40px 20px; }
    .site-wrapper { max-width: 100%; display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; padding: 0 40px; }
    .content-left { max-width: 580px; width: 100%; }
    .logo { font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: 26px; color: #000000; text-decoration: none; display: block; margin-bottom: 25px; }
    aside { width: 140px; flex-shrink: 0; font-family: Arial, Helvetica, sans-serif; font-size: 11px; margin-top: 250px; margin-right: 60px; }
    .nav-list { list-style: none; margin-bottom: 30px; padding: 0; }
    .nav-list li { margin-bottom: 6px; }
    .nav-list a { color: #000000; text-decoration: underline; }
    .nav-list a:hover { background-color: #ffff00; }
    .author-key { font-size: 10px; color: #555555; list-style: none; padding: 0; margin: 0; }
    .author-key li { margin-bottom: 6px; list-style: none; }
    .author-key a { color: #000000; text-decoration: none; }
    .author-key a:hover { text-decoration: underline; background-color: transparent; }
    .single-post { margin-bottom: 30px; }
    .post-header { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; flex-wrap: wrap; }
    .author-tag { display: inline; margin-right: 6px; background-color: #ffff00; color: #000000; text-decoration: none; padding: 2px 4px; font-weight: bold; text-transform: uppercase; }
    .post-title { display: inline; margin-right: 6px; text-transform: uppercase; font-weight: bold; }
    .post-date { color: #888888; font-weight: normal; font-size: 11px; }
    .full-post-image { width: 100%; height: auto; max-width: 100%; display: block; margin: 15px 0; }
    .post-text-content { font-size: 13px; line-height: 1.6; margin-bottom: 30px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <div class="content-left">
      <a href="../index.html" class="logo">faapd</a>
      <article class="single-post">
        <div class="post-header">
          <span class="author-tag">${author}</span>
          <span class="post-title">${title}</span>
          <span class="post-date">${exactTimestamp}</span>
        </div>
        <img src="${base64ImageData}" alt="${title}" class="full-post-image">
        <div class="post-text-content">
          <p>${text}</p>
        </div>
      </article>
    </div>
    <aside>
      <ul class="nav-list">
        <li><a href="../about.html">ABOUT</a></li>
      </ul>
      <ul class="author-key">
        <li><a href="../franklinabboud.html">Franklin Abboud</a></li>
        <li><a href="../patrickdaughety.html">Patrick Daughety</a></li>
      </ul>
    </aside>
  </div>
</body>
</html>`;

        const filename = `${slugify(title)}.html`;
        const repoOwner = "famouspunk4";
        const repoName = "faapd";
        const apiPath = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/posts/${filename}`;

        const encodedContent = btoa(unescape(encodeURIComponent(postHtmlContent)));

        try {
          const response = await fetch(apiPath, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json',
              'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify({
              message: `Add post: ${title}`,
              content: encodedContent,
              branch: "main"
            })
          });

          if (response.ok) {
            statusDiv.textContent = `Success! Post published. Redirecting to homepage...`;
            
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1500);
          } else {
            const errData = await response.json();
            statusDiv.style.color = "red";
            statusDiv.textContent = `Error: ${errData.message}`;
            submitBtn.disabled = false;
          }
        } catch (err) {
          statusDiv.style.color = "red";
          statusDiv.textContent = `Request failed: ${err.message}`;
          submitBtn.disabled = false;
        }
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
