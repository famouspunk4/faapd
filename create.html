<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .site-wrapper {
      max-width: 100%;
      padding: 0 40px;
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      display: inline-block;
    }

    .form-container {
      max-width: 580px;
      margin: 60px auto 0 auto;
    }

    .form-group {
      margin-bottom: 15px;
      font-family: Arial, Helvetica, sans-serif;
      position: relative;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      font-size: 12px;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
    }

    input::placeholder {
      color: #888888;
      opacity: 1;
    }

    /* Custom Dropdown Styling */
    .dropdown-container {
      position: relative;
      width: 100%;
    }

    .dropdown-container input[type="text"] {
      padding-right: 25px;
    }

    .dropdown-arrow {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #000000;
    }

    .dropdown-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-top: none;
      z-index: 100;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .dropdown-list li {
      padding: 8px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      cursor: pointer;
    }

    .dropdown-list li:hover {
      background-color: #f0f0f0;
    }

    /* Custom Multi-File Upload Styling */
    .file-drop-zone {
      border: 1px solid #ccc;
      padding: 12px;
      background-color: #ffffff;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }

    .file-drop-zone:hover, .file-drop-zone.dragover {
      background-color: #f9f9f9;
      border-color: #000000;
    }

    .file-drop-prompt {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      user-select: none;
    }

    .file-preview-list {
      margin-top: 8px;
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-preview-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f0f0f0;
      padding: 6px 8px;
      font-size: 11px;
    }

    .file-preview-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      max-width: 80%;
    }

    .file-preview-info span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cover-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    .remove-file-btn {
      background: none;
      border: none;
      color: red;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
      font-size: 12px;
      line-height: 1;
    }

    button[type="submit"] {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="site-wrapper">
    <a href="index.html" class="logo">faapd</a>

    <div class="form-container">
      <form id="post-form">
        <div class="form-group">
          <label for="github-token">Key</label>
          <input type="password" id="github-token" placeholder="" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <div class="dropdown-container">
            <input type="text" id="author" placeholder="None" required autocomplete="off">
            <span class="dropdown-arrow"></span>
            <ul class="dropdown-list" id="author-dropdown">
              <li>Franklin Abboud</li>
              <li>Patrick Daughety</li>
            </ul>
          </div>
        </div>

        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" required>
        </div>

        <div class="form-group">
          <label>Images</label>
          <div class="file-drop-zone" id="drop-zone">
            <div class="file-drop-prompt">Click or drag images here to add</div>
            <input type="file" id="image-files" accept="image/*" multiple style="display: none;">
          </div>
          <ul class="file-preview-list" id="file-list"></ul>
        </div>

        <div class="form-group">
          <label for="text">Description</label>
          <textarea id="text" rows="5" required></textarea>
        </div>

        <button type="submit" id="submit-btn">Publish Post</button>
      </form>

      <div id="status"></div>
    </div>
  </div>

  <script>
    const authorInput = document.getElementById('author');
    const authorDropdown = document.getElementById('author-dropdown');

    authorInput.addEventListener('focus', () => {
      authorDropdown.style.display = 'block';
    });

    document.addEventListener('click', (e) => {
      if (!authorInput.contains(e.target) && !authorDropdown.contains(e.target)) {
        authorDropdown.style.display = 'none';
      }
    });

    authorDropdown.querySelectorAll('li').forEach(item => {
      item.addEventListener('click', () => {
        authorInput.value = item.textContent;
        authorDropdown.style.display = 'none';
      });
    });

    // File accumulation & Cover Selector logic
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('image-files');
    const fileListContainer = document.getElementById('file-list');
    let selectedFiles = [];
    let coverIndex = 0;

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        addFiles(Array.from(e.dataTransfer.files));
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        addFiles(Array.from(e.target.files));
        fileInput.value = '';
      }
    });

    function addFiles(newFiles) {
      const validImages = newFiles.filter(f => f.type.startsWith('image/'));
      selectedFiles = selectedFiles.concat(validImages);
      renderFileList();
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      if (coverIndex >= selectedFiles.length) {
        coverIndex = Math.max(0, selectedFiles.length - 1);
      }
      renderFileList();
    }

    function renderFileList() {
      fileListContainer.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const li = document.createElement('li');
        li.className = 'file-preview-item';
        
        const infoDiv = document.createElement('div');
        infoDiv.className = 'file-preview-info';

        const nameSpan = document.createElement('span');
        nameSpan.textContent = file.name;

        infoDiv.appendChild(nameSpan);

        const actionsDiv = document.createElement('div');
        actionsDiv.style.display = 'flex';
        actionsDiv.style.alignItems = 'center';
        actionsDiv.style.gap = '12px';

        // Radio button to pick cover image
        const coverLabel = document.createElement('label');
        coverLabel.className = 'cover-label';
        
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'cover-image';
        radio.checked = (index === coverIndex);
        radio.onchange = () => {
          coverIndex = index;
        };

        coverLabel.appendChild(radio);
        coverLabel.appendChild(document.createTextNode(' Cover'));

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-file-btn';
        removeBtn.textContent = '✕';
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          removeFile(index);
        };

        actionsDiv.appendChild(coverLabel);
        actionsDiv.appendChild(removeBtn);

        li.appendChild(infoDiv);
        li.appendChild(actionsDiv);
        fileListContainer.appendChild(li);
      });
    }

    function slugify(text) {
      return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/\s+/g, '-')
        .replace(/[^\w\-]+/g, '')
        .replace(/\-\-+/g, '-');
    }

    function getExactFormattedTimestamp() {
      const now = new Date();
      const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(now.getUTCDate()).padStart(2, '0');
      const yy = String(now.getUTCFullYear()).slice(-2);
      
      let hours = now.getUTCHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const hh = String(hours).padStart(2, '0');
      
      const min = String(now.getUTCMinutes()).padStart(2, '0');
      const ss = String(now.getUTCSeconds()).padStart(2, '0');
      
      return `${mm}.${dd}.${yy} @ ${hh}:${min}:${ss} ${ampm} UTC`;
    }

    function getIsoTimestamp() {
      const now = new Date();
      const yyyy = now.getUTCFullYear();
      const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(now.getUTCDate()).padStart(2, '0');
      const hh = String(now.getUTCHours()).padStart(2, '0');
      const min = String(now.getUTCMinutes()).padStart(2, '0');
      const ss = String(now.getUTCSeconds()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}-${hh}${min}${ss}`;
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('post-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      let rawToken = document.getElementById('github-token').value;
      const token = rawToken.replace(/[^\x20-\x7E]/g, "").trim();

      const author = authorInput.value.trim().toUpperCase();
      const title = document.getElementById('title').value.trim().toUpperCase();
      const text = document.getElementById('text').value.trim();
      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');

      if (!token) {
        alert("Please enter a valid GitHub Access Token.");
        return;
      }

      if (selectedFiles.length === 0) {
        alert("Please select at least one image file.");
        return;
      }

      statusDiv.style.color = "#000000";
      statusDiv.textContent = "Publishing to GitHub...";
      submitBtn.disabled = true;

      try {
        // Rearrange files so the selected cover image is placed first
        const reorderedFiles = [...selectedFiles];
        const [coverFile] = reorderedFiles.splice(coverIndex, 1);
        reorderedFiles.unshift(coverFile);

        const base64Images = await Promise.all(reorderedFiles.map(readFileAsBase64));
        const exactTimestamp = getExactFormattedTimestamp();

        const imagesHtml = base64Images.map(src => 
          `<img src="${src}" alt="${title}" class="post-thumb" style="width: 120px !important; height: auto !important; display: block !important; margin-bottom: 10px !important;">`
        ).join('');

        const postHtmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title} - faapd</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #ffffff; color: #000000; font-family: Georgia, "Times New Roman", Times, serif; font-size: 13px; line-height: 1.5; padding: 40px 20px; }
    .site-wrapper { max-width: 100%; display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; padding: 0 40px; }
    .content-left { max-width: 580px; width: 100%; }
    .logo { font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: 26px; color: #000000; text-decoration: none; display: block; margin-bottom: 25px; }
    aside { width: 140px; flex-shrink: 0; font-family: Arial, Helvetica, sans-serif; font-size: 11px; margin-top: 250px; margin-right: 60px; }
    .nav-list { list-style: none; margin-bottom: 30px; padding: 0; }
    .nav-list li { margin-bottom: 6px; }
    .nav-list a { color: #000000; text-decoration: underline; }
    .nav-list a:hover { background-color: #ffff00; }
    .author-key { font-size: 10px; color: #555555; list-style: none; padding: 0; margin: 0; }
    .author-key li { margin-bottom: 6px; list-style: none; }
    .author-key a { color: #000000; text-decoration: none; }
    .author-key a:hover { text-decoration: underline; background-color: transparent; }
    .single-post { margin-bottom: 30px; }
    .post-header { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; flex-wrap: wrap; }
    .author-tag { display: inline-block; margin-right: 6px; background-color: #ffff00; color: #000000; text-decoration: none; padding: 0 2px; line-height: 1.1; font-weight: bold; text-transform: uppercase; }
    .post-title { display: inline; margin-right: 6px; text-transform: uppercase; font-weight: bold; }
    .post-date { color: #888888; font-weight: normal; font-size: 11px; }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <div class="content-left">
      <a href="../index.html" class="logo">faapd</a>
      <article class="single-post">
        <div class="post-header">
          <span class="author-tag">${author}</span>
          <span class="post-title">${title}</span>
          <span class="post-date">${exactTimestamp}</span>
        </div>
        <div class="post-content-row" style="display: flex !important; align-items: flex-start !important; justify-content: flex-start !important; gap: 15px !important; margin-top: 10px !important;">
          <div class="post-images-column" style="flex-shrink: 0 !important; display: flex !important; flex-direction: column !important; align-items: flex-start !important;">
            ${imagesHtml}
          </div>
          <div class="post-text-content" style="font-size: 13px !important; line-height: 1.3 !important; flex-grow: 1 !important; margin: 0 !important; padding: 0 !important; align-self: flex-start !important; white-space: pre-wrap !important;">
            <p style="margin: 0 !important; padding: 0 !important; line-height: 1.3 !important; display: block !important;">${text}</p>
          </div>
        </div>
      </article>
    </div>
    <aside>
      <ul class="nav-list">
        <li><a href="../about.html">ABOUT</a></li>
      </ul>
      <ul class="author-key">
        <li><a href="../franklinabboud.html">Franklin Abboud</a></li>
        <li><a href="../patrickdaughety.html">Patrick Daughety</a></li>
      </ul>
    </aside>
  </div>
</body>
</html>`;

        const filename = `${getIsoTimestamp()}-${slugify(title)}.html`;
        const repoOwner = "famouspunk4";
        const repoName = "faapd";
        const apiPath = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/posts/${filename}`;

        const encodedContent = btoa(unescape(encodeURIComponent(postHtmlContent)));

        const response = await fetch(apiPath, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({
            message: `Add post: ${title}`,
            content: encodedContent,
            branch: "main"
          })
        });

        if (response.ok) {
          statusDiv.textContent = `Success! Post published. Redirecting to homepage...`;
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          const errData = await response.json();
          statusDiv.style.color = "red";
          statusDiv.textContent = `Error: ${errData.message}`;
          submitBtn.disabled = false;
        }
      } catch (err) {
        statusDiv.style.color = "red";
        statusDiv.textContent = `Request failed: ${err.message}`;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
