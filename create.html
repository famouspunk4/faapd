<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .site-wrapper {
      max-width: 100%;
      padding: 0 40px;
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      display: inline-block;
    }

    .form-container {
      max-width: 580px;
      margin: 60px auto 0 auto;
    }

    .form-group {
      margin-bottom: 15px;
      font-family: Arial, Helvetica, sans-serif;
      position: relative;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      font-size: 12px;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
    }

    input::placeholder {
      color: #888888;
      opacity: 1;
    }

    /* Custom Dropdown Styling */
    .dropdown-container {
      position: relative;
      width: 100%;
    }

    .dropdown-container input[type="text"] {
      padding-right: 25px;
    }

    .dropdown-arrow {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #000000;
    }

    .dropdown-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-top: none;
      z-index: 100;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .dropdown-list li {
      padding: 8px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      cursor: pointer;
    }

    .dropdown-list li:hover {
      background-color: #f0f0f0;
    }

    /* Custom Multi-File Upload Styling */
    .file-drop-zone {
      border: 1px solid #ccc;
      padding: 12px;
      background-color: #ffffff;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }

    .file-drop-zone:hover, .file-drop-zone.dragover {
      background-color: #f9f9f9;
      border-color: #000000;
    }

    .file-drop-prompt {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      user-select: none;
    }

    .file-preview-list {
      margin-top: 8px;
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-preview-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f0f0f0;
      padding: 6px 8px;
      font-size: 11px;
    }

    .file-preview-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      max-width: 65%;
    }

    .preview-thumb {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border: 1px solid #ccc;
      flex-shrink: 0;
    }

    .file-preview-info span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .move-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      padding: 0 3px;
      color: #000000;
    }

    .move-btn:disabled {
      opacity: 0.2;
      cursor: default;
    }

    .remove-file-btn {
      background: none;
      border: none;
      color: red;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
      font-size: 12px;
      line-height: 1;
    }

    button[type="submit"] {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
    }

    /* Mobile Responsiveness Rules */
    @media (max-width: 768px) {
      body {
        padding: 20px 15px;
      }

      .site-wrapper {
        padding: 0;
      }

      .form-container {
        margin-top: 30px;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="site-wrapper">
    <a href="index.html" class="logo">faapd</a>

    <div class="form-container">
      <form id="post-form">
        <div class="form-group">
          <label for="github-token">Key</label>
          <input type="password" id="github-token" placeholder="" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <div class="dropdown-container">
            <input type="text" id="author" placeholder="None" autocomplete="off">
            <span class="dropdown-arrow"></span>
            <ul class="dropdown-list" id="author-dropdown">
              <li>Franklin Abboud</li>
              <li>Patrick Daughety</li>
            </ul>
          </div>
        </div>

        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="Untitled">
        </div>

        <div class="form-group">
          <label>Images</label>
          <div class="file-drop-zone" id="drop-zone">
            <div class="file-drop-prompt">Click or drag images here to add</div>
            <input type="file" id="image-files" accept="image/*" multiple style="display: none;">
          </div>
          <ul class="file-preview-list" id="file-list"></ul>
        </div>

        <div class="form-group">
          <label for="text">Description</label>
          <textarea id="text" rows="5"></textarea>
        </div>

        <button type="submit" id="submit-btn">Publish Post</button>
      </form>

      <div id="status"></div>
    </div>
  </div>

  <script>
    const authorInput = document.getElementById('author');
    const authorDropdown = document.getElementById('author-dropdown');

    authorInput.addEventListener('focus', () => {
      authorDropdown.style.display = 'block';
    });

    document.addEventListener('click', (e) => {
      if (!authorInput.contains(e.target) && !authorDropdown.contains(e.target)) {
        authorDropdown.style.display = 'none';
      }
    });

    authorDropdown.querySelectorAll('li').forEach(item => {
      item.addEventListener('click', () => {
        authorInput.value = item.textContent;
        authorDropdown.style.display = 'none';
      });
    });

    // File accumulation & manual ordering logic
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('image-files');
    const fileListContainer = document.getElementById('file-list');
    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        addFiles(Array.from(e.dataTransfer.files));
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        addFiles(Array.from(e.target.files));
        fileInput.value = '';
      }
    });

    function addFiles(newFiles) {
      const validImages = newFiles.filter(f => f.type.startsWith('image/'));
      selectedFiles = selectedFiles.concat(validImages);
      renderFileList();
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderFileList();
    }

    function moveFile(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= selectedFiles.length) return;
      const temp = selectedFiles[index];
      selectedFiles[index] = selectedFiles[targetIndex];
      selectedFiles[targetIndex] = temp;
      renderFileList();
    }

    function renderFileList() {
      fileListContainer.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const li = document.createElement('li');
        li.className = 'file-preview-item';
        
        const infoDiv = document.createElement('div');
        infoDiv.className = 'file-preview-info';

        // Image thumbnail preview element
        const thumbImg = document.createElement('img');
        thumbImg.className = 'preview-thumb';
        thumbImg.src = URL.createObjectURL(file);

        const nameSpan = document.createElement('span');
        nameSpan.textContent = `${index + 1}. ${file.name}`;

        infoDiv.appendChild(thumbImg);
        infoDiv.appendChild(nameSpan);

        const actionsDiv = document.createElement('div');
        actionsDiv.style.display = 'flex';
        actionsDiv.style.alignItems = 'center';
        actionsDiv.style.gap = '6px';

        // Up/Down Reordering buttons
        const upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.className = 'move-btn';
        upBtn.textContent = '▲';
        upBtn.disabled = (index === 0);
        upBtn.onclick = (e) => {
          e.stopPropagation();
          moveFile(index, -1);
        };

        const downBtn = document.createElement('button');
        downBtn.type = 'button';
        downBtn.className = 'move-btn';
        downBtn.textContent = '▼';
        downBtn.disabled = (index === selectedFiles.length - 1);
        downBtn.onclick = (e) => {
          e.stopPropagation();
          moveFile(index, 1);
        };

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-file-btn';
        removeBtn.textContent = '✕';
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          removeFile(index);
        };

        actionsDiv.appendChild(upBtn);
        actionsDiv.appendChild(downBtn);
        actionsDiv.appendChild(removeBtn);

        li.appendChild(infoDiv);
        li.appendChild(actionsDiv);
        fileListContainer.appendChild(li);
      });
    }

    function slugify(text) {
      return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/\s+/g, '-')
        .replace(/[^\w\-]+/g, '')
        .replace(/\-\-+/g, '-');
    }

    function getExactFormattedTimestamp() {
      const now = new Date();
      const date = now.toLocaleDateString('en-US', { timeZone: 'UTC', month: '2-digit', day: '2-digit', year: '2-digit' }).replace(/\//g, '.');
      const time = now.toLocaleTimeString('en-GB', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit', second: '2-digit' });
      return `${date} @ ${time} UTC`;
    }

    function getIsoTimestamp() {
      const now = new Date();
      const yyyy = now.getUTCFullYear();
      const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(now.getUTCDate()).padStart(2, '0');
      const hh = String(now.getUTCHours()).padStart(2, '0');
      const min = String(now.getUTCMinutes()).padStart(2, '0');
      const ss = String(now.getUTCSeconds()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}-${hh}${min}${ss}`;
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('post-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      let rawToken = document.getElementById('github-token').value;
      const token = rawToken.replace(/[^\x20-\x7E]/g, "").trim();

      let author = authorInput.value.trim().toUpperCase();
      if (!author) author = "ANONYMOUS";

      let title = document.getElementById('title').value.trim().toUpperCase();
      if (!title) title = "UNTITLED POST";

      const text = document.getElementById('text').value.trim();
      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');

      if (!token) {
        alert("Please enter a valid GitHub Access Token.");
        return;
      }

      statusDiv.style.color = "#000000";
      statusDiv.textContent = "Publishing to GitHub...";
      submitBtn.disabled = true;

      try {
        const base64Images = await Promise.all(selectedFiles.map(readFileAsBase64));
        const exactTimestamp = getExactFormattedTimestamp();

        const imagesHtml = base64Images.length > 0 ? base64Images.map(src => 
          `<img src="${src}" alt="${title}" class="full-post-image" style="width: 100% !important; height: auto !important; max-width: 100% !important; display: block !important;">`
        ).join('') : '';

        const textHtml = text ? `<div class="post-text-content" style="font-size: 13px !important; line-height: 1.5 !important; margin-top: 15px !important; margin-bottom: 30px !important; white-space: pre-wrap !important; text-align: left !important;"><p style="margin: 0 !important; padding: 0 !important; line-height: 1.5 !important;">${text}</p></div>` : '';

        const postHtmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title} - faapd</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #ffffff; color: #000000; font-family: Georgia, "Times New Roman", Times, serif; font-size: 13px; line-height: 1.5; padding: 40px 20px; }
    .site-wrapper { max-width: 100%; display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; padding: 0 40px; }
    .content-left { max-width: 580px; width: 100%; text-align: left; }
    .logo { font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: 26px; color: #000000; text-decoration: none; display: inline-block; margin-bottom: 25px; width: fit-content !important; }
    aside { width: 140px; flex-shrink: 0; font-family: Arial, Helvetica, sans-serif; font-size: 11px; margin-top: 250px; margin-right: 60px; text-align: left; }
    .nav-list { list-style: none; margin-bottom: 30px; padding: 0; }
    .nav-list li { margin-bottom: 6px; }
    .nav-list a { color: #000000; text-decoration: underline; }
    .nav-list a:hover { background-color: #ffff00; }
    .author-key { font-size: 10px; color: #555555; list-style: none; padding: 0; margin: 0; }
    .author-key li { margin-bottom: 6px; list-style: none; }
    .author-key a { color: #000000; text-decoration: none; }
    .author-key a:hover { text-decoration: underline; background-color: transparent; }
    .single-post { margin-bottom: 30px; text-align: left; }
    .post-header { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; flex-wrap: wrap; text-align: left; }
    .author-tag { display: inline-block; margin-right: 6px; background-color: #ffff00; color: #000000; text-decoration: none; padding: 0 2px; line-height: 1.1; font-weight: bold; text-transform: uppercase; }
    .post-title { display: inline; margin-right: 6px; text-transform: uppercase; font-weight: bold; }
    .post-date { color: #888888; font-weight: normal; font-size: 11px; }
    .post-text-content { font-size: 13px; line-height: 1.5; margin-top: 15px; margin-bottom: 30px; white-space: pre-wrap; text-align: left; }
    .post-text-content p { margin: 0 !important; padding: 0 !important; line-height: 1.5 !important; }
    .post-images-container { width: 100%; display: flex; flex-direction: column; gap: 10px; margin: 15px 0; align-items: flex-start; }
    .full-post-image { width: 100%; height: auto; max-width: 100%; display: block; }

    @media (max-width: 768px) {
      body { padding: 20px 15px; }
      .site-wrapper { flex-direction: column; padding: 0; gap: 30px; }
      .content-left { max-width: 100%; }
      aside { width: 100%; margin-top: 20px; margin-right: 0; }
    }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <div class="content-left">
      <a href="../index.html" class="logo">faapd</a>
      <article class="single-post">
        <div class="post-header">
          <span class="author-tag">${author}</span>
          <span class="post-title">${title}</span>
          <span class="post-date">${exactTimestamp}</span>
        </div>
        ${textHtml}
        ${imagesHtml ? `<div class="post-images-container">${imagesHtml}</div>` : ''}
      </article>
    </div>
    <aside>
      <ul class="nav-list">
        <li><a href="../about.html">ABOUT</a></li>
      </ul>
      <ul class="author-key">
        <li><a href="../franklinabboud.html">Franklin Abboud</a></li>
        <li><a href="../patrickdaughety.html">Patrick Daughety</a></li>
      </ul>
    </aside>
  </div>
</body>
</html>`;

        const fileSlug = slugify(title) || 'post';
        const filename = `${getIsoTimestamp()}-${fileSlug}.html`;
        const repoOwner = "famouspunk4";
        const repoName = "faapd";
        const apiPath = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/posts/${filename}`;

        const encodedContent = btoa(unescape(encodeURIComponent(postHtmlContent)));

        const response = await fetch(apiPath, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({
            message: `Add post: ${title}`,
            content: encodedContent,
            branch: "main"
          })
        });

        if (response.ok) {
          statusDiv.textContent = `Success! Post published. Redirecting to homepage...`;
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          const errData = await response.json();
          statusDiv.style.color = "red";
          statusDiv.textContent = `Error: ${errData.message}`;
          submitBtn.disabled = false;
        }
      } catch (err) {
        statusDiv.style.color = "red";
        statusDiv.textContent = `Request failed: ${err.message}`;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
