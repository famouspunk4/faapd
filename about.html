<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mud - about</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .site-wrapper { 
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      padding: 0 40px;
    }

    /* Left Section: Logo & About Content */
    .content-left {
      max-width: 580px;
      width: 100%;
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      display: block;
      margin-bottom: 25px;
    }

    /* About Section Header & Text Box */
    .page-title {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }

    .about-text {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.6;
      color: #000000;
    }

    .about-text p {
      margin-bottom: 15px;
    }

    /* Right Section: Navigation Directory */
    sidebar {
      width: 140px;
      flex-shrink: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      margin-top: 250px;
      margin-right: 60px;
    }

    .nav-list { list-style: none; margin-bottom: 30px; }
    .nav-list li { margin-bottom: 6px; }
    .nav-list a { color: #000000; text-decoration: underline; }
    .nav-list a:hover { background-color: #ffff00; }
    .author-key { font-size: 10px; color: #555555; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="site-wrapper">
    
    <!-- Left Column: Logo + Editable Content -->
    <div class="content-left">
      <a href="index.html" class="logo">mud</a>
      
      <div class="page-title">ABOUT</div>

      <!-- EDITABLE TEXT BOX BELOW -->
      <div class="about-text">
        <p>mud is a digital archive and journal tracking work, visuals, and thoughts across art, music, fashion, and culture.</p>
        <p>You can add more paragraphs or details here whenever you want to update the page.</p>
      </div>
    </div>

           </div>
    </sidebar>

  </div>

</body>
</html>
