<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd - About</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .site-wrapper {
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      padding: 0 40px;
    }

    /* Left Section: Logo & About Content */
    .content-left {
      max-width: 580px;
      width: 100%;
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      display: block;
      margin-bottom: 25px;
    }

    /* About Section Header & Text Box */
    .page-title {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }

    .about-text {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.6;
      color: #000000;
    }

    .about-text p {
      margin-bottom: 15px;
    }

    /* Right Section: Navigation Directory */
    aside {
      width: 140px;
      flex-shrink: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      margin-top: 250px;
      margin-right: 60px;
    }

    .nav-list {
      list-style: none;
      margin-bottom: 30px;
    }

    .nav-list li {
      margin-bottom: 6px;
    }

    .nav-list a {
      color: #000000;
      text-decoration: underline;
    }

    .nav-list a:hover {
      background-color: #ffff00;
    }

    .author-key {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 10px;
      color: #555555;
      line-height: 1.4;
    }

    .author-key li {
      margin-bottom: 4px;
    }

    .author-key a {
      color: #555555;
      text-decoration: none;
    }

    .author-key a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <!-- Left Column: Logo + Editable Content -->
    <div class="content-left">
      <a href="index.html" class="logo">faapd</a>

      <div class="page-title">ABOUT</div>

      <!-- EDITABLE TEXT BOX BELOW -->
      <div class="about-text">
        <p>The digital archive and blog of Franklin Abboud and Patrick Daughety.</p>
        <p>- faapd</p>
      </div>
    </div>

    <!-- Right Column: Navigation Directory -->
    <aside>
      <ul class="nav-list">
        <li><a href="about.html">ABOUT</a></li>
      </ul>
      <ul class="author-key">
        <li><a href="franklinabboud.html">Franklin Abboud</a></li>
        <li><a href="patrickdaughety.html">Patrick Daughety</a></li>
      </ul>
    </aside>

  </div>

</body>
</html>
