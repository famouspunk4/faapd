<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    /* Single Post Display */
    .single-post {
      margin-bottom: 30px;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .author-tag {
      display: inline;
      margin-right: 6px;
      background-color: #ffff00;
      color: #000000;
      text-decoration: none;
      padding: 0 2px;
      line-height: 1.1;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title {
      display: inline;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .post-date {
      color: #888888;
      font-weight: normal;
      font-size: 11px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: normal;
      cursor: pointer;
      margin-left: 8px;
      padding: 0;
      text-decoration: none;
    }

    .delete-btn:hover {
      text-decoration: underline;
    }

    .post-images-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0 15px 0;
    }

    .full-post-image {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
    }

    .post-text-content {
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
      margin-bottom: 30px;
      white-space: pre-wrap;
    }

    .post-text-content p {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.5 !important;
    }

    /* Comments Section */
    .comments-section {
      border-top: 1px solid #eeeeee;
      padding-top: 25px;
      margin-top: 30px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .comments-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }

    .comment {
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #eee;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .comment-timestamp {
      font-size: 11px;
      color: #888888;
      font-family: monospace;
    }

    .comment-body {
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .add-comment-form {
      margin-top: 20px;
    }

    .add-comment-form input[type="text"],
    .add-comment-form textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #000000;
      outline: none;
    }

    .add-comment-form input[type="text"]::placeholder,
    .add-comment-form textarea::placeholder {
      color: #777777;
    }

    .add-comment-form button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* Account Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid #000000;
      padding: 25px;
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .modal-box h3 {
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .modal-box input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .modal-actions button.cancel-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
    }
  </style>
</head>
<body>

  <!-- Layout Container -->
  <div id="layout-container"></div>

  <!-- Hidden Content Template for Post Details & Comments -->
  <template id="post-page-template">
    <div id="post-content">Loading post...</div>

    <section class="comments-section">
      <h3>Comments</h3>
      <div id="comments-list"></div>

      <div class="add-comment-form">
        <input type="text" id="comment-author" placeholder="Your Name" required>
        <textarea id="comment-text" rows="3" placeholder="Leave a comment..." required></textarea>
        <button onclick="addComment()">Submit Comment</button>
      </div>
    </section>
  </template>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>Account Login</h3>
      <input type="password" id="modal-passcode" placeholder="Enter Passcode" />
      <div class="modal-actions">
        <button class="cancel-btn" id="modal-cancel">Cancel</button>
        <button id="modal-submit">Enter</button>
      </div>
    </div>
  </div>

  <script src="posts.js"></script>
  <script>
    const ADMIN_PIN = "1234";

    const params = new URLSearchParams(window.location.search);
    const postFile = params.get('file');
    const postId = params.get('id') || postFile;

    // Fetch layout.html and populate main-content area
    fetch('layout.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('layout-container').innerHTML = html;

        // Inject page template content into layout's main container
        const content = document.getElementById('post-page-template').content.cloneNode(true);
        document.getElementById('main-content').appendChild(content);

        initModalEvents();
        loadPost();
        loadComments();
      })
      .catch(err => console.error('Error loading layout:', err));

    function initModalEvents() {
      const accountIconBtn = document.getElementById('account-icon-btn');
      const loginModal = document.getElementById('login-modal');
      const modalCancel = document.getElementById('modal-cancel');
      const modalSubmit = document.getElementById('modal-submit');
      const modalPasscode = document.getElementById('modal-passcode');

      if (accountIconBtn) {
        accountIconBtn.addEventListener('click', (e) => {
          e.preventDefault();
          loginModal.style.display = 'flex';
          modalPasscode.focus();
        });
      }

      modalCancel.addEventListener('click', () => {
        loginModal.style.display = 'none';
        modalPasscode.value = '';
      });

      modalSubmit.addEventListener('click', handleLogin);
      modalPasscode.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
      });

      function handleLogin() {
        if (modalPasscode.value.trim() !== '') {
          loginModal.style.display = 'none';
          window.location.href = 'create.html';
        } else {
          alert('Please enter a passcode.');
        }
      }
    }

    async function loadPost() {
      const container = document.getElementById('post-content');
      if (!container) return;

      // 1. Check local/static storage first
      const localPosts = JSON.parse(localStorage.getItem('custom_posts')) || [];
      const staticPosts = (typeof postsData !== 'undefined') ? postsData : [];
      let foundPost = [...localPosts, ...staticPosts].find(p => p.id == postId || p.url === `posts/${postFile}`);

      if (foundPost) {
        renderSinglePost({
          author: foundPost.author,
          title: foundPost.title,
          dateStr: foundPost.dateStr,
          images: Array.isArray(foundPost.images) ? foundPost.images : (foundPost.image ? [foundPost.image] : []),
          text: foundPost.text
        });
        return;
      }

      // 2. Fetch raw file from GitHub /posts/ directory
      if (postFile) {
        try {
          const res = await fetch(`posts/${postFile}`);
          if (!res.ok) throw new Error("File not found");
          const htmlText = await res.text();

          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          const author = doc.querySelector('.author-tag')?.textContent?.trim() || "FRANKLIN ABBOUD";
          const title = doc.querySelector('.post-title')?.textContent?.trim() || postFile.replace('.html', '').replace(/-/g, ' ').toUpperCase();
          const timestamp = doc.querySelector('.post-date')?.textContent?.trim() || '';
          
          // Extract ALL img elements from the post file
          const imgElements = doc.querySelectorAll('.post-images-column img, .full-post-image, .post-thumb, img');
          const images = Array.from(imgElements).map(img => img.getAttribute('src')).filter(Boolean);

          const textContainer = doc.querySelector('.post-text-content, .post-text');
          let bodyText = textContainer ? textContainer.innerHTML.trim() : (doc.querySelector('p')?.innerHTML?.trim() || '');
          
          // Clean up leading/trailing paragraph tags from external HTML files
          bodyText = bodyText.replace(/^<p[^>]*>/i, '').replace(/<\/p>$/i, '').trim();

          renderSinglePost({
            author: author,
            title: title,
            dateStr: timestamp,
            images: images,
            text: bodyText
          });
        } catch (e) {
          container.innerHTML = `<p>Post not found.</p>`;
        }
      } else {
        container.innerHTML = `<p>Post not found.</p>`;
      }
    }

    function renderSinglePost(p) {
      const imagesList = p.images || [];
      const imagesHtml = imagesList.map(src => `<img src="${src}" alt="${p.title}" class="full-post-image">`).join('');
      const bodyContent = p.text || '';

      const postContentElem = document.getElementById('post-content');
      if (postContentElem) {
        postContentElem.innerHTML = `
          <article class="single-post">
            <div class="post-header">
              <span class="author-tag">${p.author}</span>
              <span class="post-title">${p.title}</span>
              <span class="post-date">${p.dateStr || ''}</span>
            </div>
            ${imagesList.length > 0 ? `<div class="post-images-container">${imagesHtml}</div>` : ''}
            ${bodyContent ? `<div class="post-text-content">${bodyContent}</div>` : ''}
          </article>
        `;
      }
    }

    /* Comments Section */
    function getCurrentTimestamp() {
      const now = new Date();
      const date = now.toLocaleDateString('en-US', { timeZone: 'UTC', month: '2-digit', day: '2-digit', year: '2-digit' }).replace(/\//g, '.');
      const time = now.toLocaleTimeString('en-GB', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit', second: '2-digit' });
      return `${date} @ ${time} UTC`;
    }

    function loadComments() {
      const savedComments = JSON.parse(localStorage.getItem(`comments_${postId}`)) || [];
      const commentsList = document.getElementById('comments-list');
      if (!commentsList) return;
      
      if (savedComments.length === 0) {
        commentsList.innerHTML = `<p style="font-size:11px; color:#888;"><em>No comments yet.</em></p>`;
        return;
      }

      commentsList.innerHTML = savedComments.map(c => `
        <div class="comment">
          <div class="comment-header">
            <strong>${c.author}</strong>
            <span class="comment-timestamp">${c.timestamp || ''}</span>
          </div>
          <p class="comment-body">${c.text}</p>
        </div>
      `).join('');
    }

    function addComment() {
      const author = document.getElementById('comment-author').value.trim();
      const text = document.getElementById('comment-text').value.trim();

      if (!author || !text) {
        alert('Please fill out both fields.');
        return;
      }

      const newComment = {
        author: author,
        text: text,
        timestamp: getCurrentTimestamp()
      };

      const savedComments = JSON.parse(localStorage.getItem(`comments_${postId}`)) || [];
      savedComments.push(newComment);
      
      localStorage.setItem(`comments_${postId}`, JSON.stringify(savedComments));

      document.getElementById('comment-author').value = '';
      document.getElementById('comment-text').value = '';
      loadComments();
    }
  </script>
</body>
</html>
