<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
    }

    /* Fixed Top Left Logo */
    .logo {
      position: fixed;
      top: 40px;
      left: 40px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      z-index: 100;
    }

    /* Outer Wrapper: Centers the post column in the middle of the screen */
    .site-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 20px;
    }

    /* Main Content Column: Left-aligns internal text while centered overall */
    .content-left {
      max-width: 580px;
      width: 100%;
      text-align: left;
    }

    /* Fixed Right Directory Menu */
    aside {
      position: fixed;
      right: 60px;
      top: 250px;
      width: 140px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      text-align: left;
    }

    .nav-list {
      list-style: none;
      margin-bottom: 30px;
    }

    .nav-list li {
      margin-bottom: 6px;
    }

    .nav-list a {
      color: #000000;
      text-decoration: underline;
    }

    .nav-list a:hover {
      background-color: #ffff00;
    }

    .author-key {
      list-style: none;
      font-size: 10px;
      color: #555555;
    }

    .author-key li {
      margin-bottom: 4px;
    }

    .author-key a {
      color: #555555;
      text-decoration: none;
    }

    .author-key a:hover {
      text-decoration: underline;
    }

    /* Single Post Display */
    .single-post {
      margin-bottom: 30px;
      text-align: left;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      text-align: left;
    }

    .author-tag {
      display: inline-block;
      margin-right: 6px;
      background-color: #ffff00;
      color: #000000;
      text-decoration: none;
      padding: 0 2px;
      line-height: 1.1;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title {
      display: inline;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .post-date {
      color: #888888;
      font-weight: normal;
      font-size: 11px;
    }

    .post-images-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      margin: 12px 0 15px 0;
    }

    .full-post-image {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
    }

    .post-text-content {
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
      margin-bottom: 30px;
      white-space: pre-wrap;
      text-align: left;
    }

    .post-text-content p {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.5 !important;
      display: inline !important;
    }

    /* Comments Section */
    .comments-section {
      border-top: 1px solid #eeeeee;
      padding-top: 25px;
      margin-top: 30px;
      font-family: Arial, Helvetica, sans-serif;
      text-align: left;
    }

    .comments-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }

    .comment {
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #eee;
      text-align: left;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .comment-timestamp {
      font-size: 11px;
      color: #888888;
      font-family: monospace;
    }

    .comment-body {
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .add-comment-form {
      margin-top: 20px;
      text-align: left;
    }

    .add-comment-form input[type="text"],
    .add-comment-form textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #000000;
      outline: none;
    }

    .add-comment-form button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* Mobile Layout Adjustments */
    @media (max-width: 768px) {
      body {
        padding: 20px 15px;
      }
      .logo {
        position: static;
        display: block;
        margin-bottom: 25px;
      }
      .site-wrapper {
        flex-direction: column;
        align-items: center;
        padding: 0;
      }
      aside {
        position: static;
        width: 100%;
        margin-top: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Left Branding Logo -->
  <a href="index.html" class="logo">faapd</a>

  <div class="site-wrapper">
    <div class="content-left">
      <main id="main-content">
        <div id="post-content">Loading post...</div>

        <section class="comments-section">
          <h3>Comments</h3>
          <div id="comments-list"></div>

          <div class="add-comment-form">
            <input type="text" id="comment-author" placeholder="Your Name" required>
            <textarea id="comment-text" rows="3" placeholder="Leave a comment..." required></textarea>
            <button onclick="addComment()">Submit Comment</button>
          </div>
        </section>
      </main>
    </div>

    <!-- Right Side Menu Directory -->
    <aside>
