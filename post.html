<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .logo {
      position: fixed;
      top: 40px;
      left: 40px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      z-index: 100;
    }

    /* Centers the main feed column on the page */
    .site-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 20px;
    }

    /* Content column: centered globally, but text inside is left-aligned */
    .content-left {
      max-width: 580px;
      width: 100%;
      text-align: left;
    }

    aside {
      position: fixed;
      right: 60px;
      top: 250px;
      width: 140px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      text-align: left;
    }

    .nav-list {
      list-style: none;
      margin-bottom: 30px;
    }

    .nav-list li {
      margin-bottom: 6px;
    }

    .nav-list a {
      color: #000000;
      text-decoration: underline;
    }

    .author-key {
      list-style: none;
      font-size: 10px;
      color: #555555;
    }

    .author-key li {
      margin-bottom: 4px;
    }

    .author-key a {
      color: #555555;
      text-decoration: none;
    }

    /* Single Post Display */
    .single-post {
      margin-bottom: 30px;
      text-align: left;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      text-align: left;
    }

    .author-tag {
      display: inline-block;
      margin-right: 6px;
      background-color: #ffff00;
      color: #000000;
      text-decoration: none;
      padding: 0 2px;
      line-height: 1.1;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title {
      display: inline;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .post-date {
      color: #888888;
      font-weight: normal;
      font-size: 11px;
    }

    .post-images-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      margin: 12px 0 15px 0;
    }

    .full-post-image {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
    }

    .post-text-content {
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
      margin-bottom: 30px;
      white-space: pre-wrap;
      text-align: left;
    }

    /* Comments Section */
    .comments-section {
      border-top: 1px solid #eeeeee;
      padding-top: 25px;
      margin-top: 30px;
      font-family: Arial, Helvetica, sans-serif;
      text-align: left;
    }

    .comments-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }

    .comment {
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #eee;
      text-align: left;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .comment-timestamp {
      font-size: 11px;
      color: #888888;
      font-family: monospace;
    }

    .comment-body {
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .add-comment-form {
      margin-top: 20px;
      text-align: left;
    }

    .add-comment-form input[type="text"],
    .add-comment-form textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #000000;
      outline: none;
    }

    .add-comment-form button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .logo {
        position: static;
        display: block;
        margin-bottom: 25px;
      }
      .site-wrapper {
        flex-direction: column;
        align-items: center;
        padding: 0;
      }
      aside {
        position: static;
        width: 100%;
        margin-top: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- Fixed Top Left Logo -->
  <a href="index.html" class="logo">faapd</a>

  <div class="site-wrapper">
    <div class="content-left">
      <main id="main-content">
        <div id="post-content">Loading post...</div>

        <section class="comments-section">
          <h3>Comments</h3>
          <div id="comments-list"></div>

          <div class="add-comment-form">
            <input type="text" id="comment-author" placeholder="Your Name" required>
            <textarea id="comment-text" rows="3" placeholder="Leave a comment..." required></textarea>
            <button onclick="addComment()">Submit Comment</button>
          </div>
        </section>
      </main>
    </div>

    <!-- Right Side Menu -->
    <aside>
      <ul class="nav-list">
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="games.html">GAMES</a></li>
      </ul>

      <ul class="author-key">
        <li><a href="franklinabboud.html">Franklin Abboud</a></li>
        <li><a href="patrickdaughety.html">Patrick Daughety</a></li>
      </ul>
    </aside>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const postFile = params.get('file');
    const postId = params.get('id') || postFile;

    async function loadPost() {
      const container = document.getElementById('post-content');
      if (!container) return;

      let localPosts = [];
      try {
        localPosts = JSON.parse(localStorage.getItem('custom_posts')) || [];
      } catch (e) {
        localPosts = [];
      }

      let foundPost = localPosts.find(p => p.id == postId || p.filename === postFile);

      if (foundPost) {
        renderSinglePost({
          author: foundPost.author || 'FRANKLIN ABBOUD',
          title: foundPost.title || 'UNTITLED POST',
          dateStr: foundPost.dateStr || foundPost.date || '',
          images: Array.isArray(foundPost.images) ? foundPost.images : (foundPost.image ? [foundPost.image] : []),
          text: foundPost.htmlText || foundPost.text || ''
        });
        return;
      }

      if (postFile) {
        try {
          let htmlText = '';
          const localFetch = await fetch(`posts/${postFile}`);
          
          if (localFetch.ok) {
            htmlText = await localFetch.text();
          } else {
            const githubRes = await fetch(`https://raw.githubusercontent.com/famouspunk4/faapd/main/posts/${postFile}`);
            if (!githubRes.ok) throw new Error("File not found");
            htmlText = await githubRes.text();
          }

          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          const author = doc.querySelector('.author-tag')?.textContent?.trim() || "FRANKLIN ABBOUD";
          const title = doc.querySelector('.post-title')?.textContent?.trim() || postFile.replace('.html', '').replace(/-/g, ' ').toUpperCase();
          const timestamp = doc.querySelector('.post-date')?.textContent?.trim() || '';
          
          const imgElements = doc.querySelectorAll('.post-images-column img, .full-post-image, .post-thumb, img');
          const images = Array.from(imgElements).map(img => img.getAttribute('src')).filter(Boolean);

          const textContainer = doc.querySelector('.post-text-content, .post-text');
          let bodyText = textContainer ? textContainer.innerHTML.trim() : (doc.querySelector('p')?.innerHTML?.trim() || '');
          bodyText = bodyText.replace(/^<p[^>]*>/i, '').replace(/<\/p>$/i, '').trim();

          renderSinglePost({
            author: author,
            title: title,
            dateStr: timestamp,
            images: images,
            text: bodyText
          });
        } catch (e) {
          container.innerHTML = `<p style="font-family: Arial, sans-serif; font-size: 11px; color: #888;">Post not found.</p>`;
        }
      } else {
        container.innerHTML = `<p style="font-family: Arial, sans-serif; font-size: 11px; color: #888;">No post specified in URL parameters.</p>`;
      }
    }

    function renderSinglePost(p) {
      const imagesList = p.images || [];
      const imagesHtml = imagesList.map(src => `<img src="${src}" alt="${p.title}" class="full-post-image">`).join('');
      const bodyContent = p.text || '';

      const postContentElem = document.getElementById('post-content');
      if (postContentElem) {
        postContentElem.innerHTML = `
          <article class="single-post">
            <div class="post-header">
              <a href="index.html?author=${encodeURIComponent(p.author)}" class="author-tag">${p.author}</a>
              <span class="post-title">${p.title}</span>
              <span class="post-date">${p.dateStr || ''}</span>
            </div>
            ${imagesList.length > 0 ? `<div class="post-images-container">${imagesHtml}</div>` : ''}
            ${bodyContent ? `<div class="post-text-content">${bodyContent}</div>` : ''}
          </article>
        `;
      }
    }

    function loadComments() {
      const savedComments = JSON.parse(localStorage.getItem(`comments_${postId}`)) || [];
      const commentsList = document.getElementById('comments-list');
      if (!commentsList) return;
      
      if (savedComments.length === 0) {
        commentsList.innerHTML = `<p style="font-size:11px; color:#888;"><em>No comments yet.</em></p>`;
        return;
      }

      commentsList.innerHTML = savedComments.map(c => `
        <div class="comment">
          <div class="comment-header">
            <strong>${c.author}</strong>
            <span class="comment-timestamp">${c.timestamp || ''}</span>
          </div>
          <p class="comment-body">${c.text}</p>
        </div>
      `).join('');
    }

    function addComment() {
      const author = document.getElementById('comment-author').value.trim();
      const text = document.getElementById('comment-text').value.trim();

      if (!author || !text) {
        alert('Please fill out both fields.');
        return;
      }

      const now = new Date();
      const date = now.toLocaleDateString('en-US', { timeZone: 'UTC', month: '2-digit', day: '2-digit', year: '2-digit' }).replace(/\//g, '.');
      const time = now.toLocaleTimeString('en-GB', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const newComment = {
        author: author,
        text: text,
        timestamp: `${date} @ ${time} UTC`
      };

      const savedComments = JSON.parse(localStorage.getItem(`comments_${postId}`)) || [];
      savedComments.push(newComment);
      
      localStorage.setItem(`comments_${postId}`, JSON.stringify(savedComments));

      document.getElementById('comment-author').value = '';
      document.getElementById('comment-text').value = '';
      loadComments();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadPost();
      loadComments();
    });
  </script>
</body>
</html>
