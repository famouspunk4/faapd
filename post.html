<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    /* Single Post Display */
    .single-post {
      margin-bottom: 30px;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .author-tag {
      display: inline;
      margin-right: 6px;
      background-color: #ffff00;
      color: #000000;
      text-decoration: none;
      padding: 0 2px;
      line-height: 1.1;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title {
      display: inline;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .post-date {
      color: #888888;
      font-weight: normal;
      font-size: 11px;
    }

    .post-text-content {
      font-size: 13px;
      line-height: 1.5;
      margin-top: 10px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    .post-text-content p {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.5 !important;
    }

    .post-images-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 15px 0;
    }

    .full-post-image {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Layout Container -->
  <div id="layout-container"></div>

  <!-- Hidden Content Template for Post Details -->
  <template id="post-page-template">
    <div id="post-content">Loading post...</div>
  </template>

  <script src="posts.js" onerror="console.warn('posts.js not found');"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let rawFile = params.get('file') || '';
    const postFile = rawFile.replace(/^posts\//, '');
    const postId = params.get('id') || postFile;

    // Fetch layout.html and populate main-content area
    fetch('layout.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('layout-container').innerHTML = html;

        // Inject page template content into layout's main container
        const content = document.getElementById('post-page-template').content.cloneNode(true);
        document.getElementById('main-content').appendChild(content);

        loadPost();
      })
      .catch(err => console.error('Error loading layout:', err));

    async function loadPost() {
      const container = document.getElementById('post-content');
      if (!container) return;

      // 1. Check local/static storage first
      const localPosts = JSON.parse(localStorage.getItem('custom_posts')) || [];
      const staticPosts = (typeof postsData !== 'undefined') ? postsData : [];
      let foundPost = [...localPosts, ...staticPosts].find(p => p.id == postId || p.filename === postFile || p.url === `posts/${postFile}`);

      if (foundPost) {
        renderSinglePost({
          author: foundPost.author,
          title: foundPost.title,
          dateStr: foundPost.dateStr || foundPost.date,
          images: Array.isArray(foundPost.images) ? foundPost.images : (foundPost.image ? [foundPost.image] : []),
          text: foundPost.htmlText || foundPost.text
        });
        return;
      }

      // 2. Fetch raw file from GitHub /posts/ directory
      if (postFile) {
        try {
          let htmlText = '';
          const fetchPaths = [
            `posts/${postFile}`,
            `./posts/${postFile}`,
            `https://raw.githubusercontent.com/famouspunk4/faapd/main/posts/${postFile}`
          ];

          for (const path of fetchPaths) {
            try {
              const res = await fetch(path);
              if (res.ok) {
                htmlText = await res.text();
                break;
              }
            } catch (err) {
              continue;
            }
          }

          if (!htmlText) throw new Error("Could not fetch file from any endpoint");

          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          // Strip any embedded login forms or legacy account login markup
          const loginElement = doc.querySelector('#login-modal, .modal-overlay, .account-login, form');
          if (loginElement) loginElement.remove();

          const author = doc.querySelector('.author-tag')?.textContent?.trim() || "FRANKLIN ABBOUD";
          const title = doc.querySelector('.post-title')?.textContent?.trim() || postFile.replace('.html', '').replace(/-/g, ' ').toUpperCase();
          const timestamp = doc.querySelector('.post-date')?.textContent?.trim() || '';
          
          // Extract image URLs
          const imgElements = doc.querySelectorAll('.post-images-column img, .full-post-image, .post-thumb, img');
          const images = Array.from(imgElements).map(img => img.getAttribute('src')).filter(Boolean);

          // Extract text description
          const textContainer = doc.querySelector('.post-text-content, .post-text');
          let bodyText = textContainer ? textContainer.innerHTML.trim() : (doc.querySelector('p')?.innerHTML?.trim() || '');
          
          // Clean up paragraph tags and unwanted login texts
          bodyText = bodyText
            .replace(/Account Login[\s\S]*/i, '')
            .replace(/^<p[^>]*>/i, '')
            .replace(/<\/p>$/i, '')
            .trim();

          renderSinglePost({
            author: author,
            title: title,
            dateStr: timestamp,
            images: images,
            text: bodyText
          });
        } catch (e) {
          container.innerHTML = `<p style="font-family: Arial, sans-serif; font-size: 11px; color: #888;">Post not found.</p>`;
        }
      } else {
        container.innerHTML = `<p style="font-family: Arial, sans-serif; font-size: 11px; color: #888;">No post specified in URL parameters.</p>`;
      }
    }

    function renderSinglePost(p) {
      const imagesList = p.images || [];
      const imagesHtml = imagesList.map(src => `<img src="${src}" alt="${p.title}" class="full-post-image">`).join('');
      const bodyContent = p.text || '';

      const postContentElem = document.getElementById('post-content');
      if (postContentElem) {
        postContentElem.innerHTML = `
          <article class="single-post">
            <div class="post-header">
              <a href="index.html?author=${encodeURIComponent(p.author)}" class="author-tag">${p.author}</a>
              <span class="post-title">${p.title}</span>
              <span class="post-date">${p.dateStr || ''}</span>
            </div>
            ${bodyContent ? `<div class="post-text-content">${bodyContent}</div>` : ''}
            ${imagesList.length > 0 ? `<div class="post-images-container">${imagesHtml}</div>` : ''}
          </article>
        `;
      }
    }
  </script>
</body>
</html>
