<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    /* Single Post Display */
    .single-post {
      margin-bottom: 30px;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .author-tag {
      display: inline;
      margin-right: 6px;
      background-color: #ffff00;
      color: #000000;
      text-decoration: none;
      padding: 0 2px;
      line-height: 1.1;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title {
      display: inline;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .post-date {
      color: #888888;
      font-weight: normal;
      font-size: 11px;
    }

    .post-images-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0 15px 0;
    }

    .full-post-image {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
    }

    .post-text-content {
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
      margin-bottom: 30px;
      white-space: pre-wrap;
    }

    .post-text-content p {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.5 !important;
    }

    /* Comments Section */
    .comments-section {
      border-top: 1px solid #eeeeee;
      padding-top: 25px;
      margin-top: 30px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .comments-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }

    .comment {
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #eee;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .comment-timestamp {
      font-size: 11px;
      color: #888888;
      font-family: monospace;
    }

    .comment-body {
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .add-comment-form {
      margin-top: 20px;
    }

    .add-comment-form input[type="text"],
    .add-comment-form textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #000000;
      outline: none;
    }

    .add-comment-form input[type="text"]::placeholder,
    .add-comment-form textarea::placeholder {
      color: #777777;
    }

    .add-comment-form button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Layout Container -->
  <div id="layout-container"></div>

  <!-- Hidden Content Template for Post Details & Comments -->
  <template id="post-page-template">
    <div id="post-content">Loading post...</div>

    <section class="comments-section">
      <h3>Comments</h3>
      <div id="comments-list"></div>

      <div class="add-comment-form">
        <input type="text" id="comment-author" placeholder="Your Name" required>
        <textarea id="comment-text" rows="3" placeholder="Leave a comment..." required></textarea>
        <button onclick="addComment()">Submit Comment</button>
      </div>
    </section>
  </template>

  <script src="posts.js" onerror="console.warn('posts.js not found');"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const postFile = params.get('file');
    const postId = params.get('id') || postFile;

    // Fetch layout.html and populate main-content area
    fetch('layout.html')
      .then(response => {
        if (!response.ok) throw new Error('Network error loading layout');
        return response.text();
      })
      .then(html => {
        document.getElementById('layout-container').innerHTML = html;
        injectTemplate();
        loadPost();
        loadComments();
      })
      .catch(err => {
        console.error('Error loading layout:', err);
        // Fallback layout initialization
        document.getElementById('layout-container').innerHTML = '<main id="main-content"></main>';
        injectTemplate();
        loadPost();
        loadComments();
      });

    function injectTemplate() {
      const main = document.getElementById('main-content');
      if (main && !document.getElementById('post-content')) {
        const content = document.getElementById('post-page-template').content.cloneNode(true);
        main.appendChild(content);
      }
    }

    async function loadPost() {
      const container = document.getElementById('post-content');
      if (!container) return;

      // 1. Check local/static storage first
      const localPosts = JSON.parse(localStorage.getItem('custom_posts')) || [];
      const staticPosts = (typeof postsData !== 'undefined') ? postsData : [];
      let foundPost = [...localPosts, ...staticPosts].find(p => p.id == postId || p.filename === postFile || p.url === `posts/${postFile}`);

      if (foundPost) {
        renderSinglePost({
          author: foundPost.author,
          title: foundPost.title,
          dateStr: foundPost.dateStr || foundPost.date,
          images: Array.isArray(foundPost.images) ? foundPost.images : (foundPost.image ? [foundPost.image] : []),
          text: foundPost.htmlText || foundPost.text
        });
        return;
      }

      // 2. Fetch raw HTML file from GitHub posts directory or fallback API
      if (postFile) {
        try {
          let htmlText = '';
          const localFetch = await fetch(`posts/${postFile}`);
