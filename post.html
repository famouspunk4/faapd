<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .site-wrapper {
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      padding: 0 40px;
    }

    /* Left Section: Post & Comments */
    .content-left {
      max-width: 580px;
      width: 100%;
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      display: block;
      margin-bottom: 25px;
    }

     /* Right Section: Navigation Directory */
    aside {
      width: 140px;
      flex-shrink: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      margin-top: 250px;
      margin-right: 60px;
    }

    .nav-list {
      list-style: none;
      margin-bottom: 30px;
    }

    .nav-list li {
      margin-bottom: 6px;
    }

    .nav-list a {
      color: #000000;
      text-decoration: underline;
    }

    .nav-list a:hover {
      background-color: #ffff00;
    }

    .author-key {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 10px;
      color: #555555;
      line-height: 1.4;
    }

    .author-key li {
      margin-bottom: 4px;
    }

    .author-key a {
      color: #555555;
      text-decoration: none;
    }

    .author-key a:hover {
      text-decoration: underline;
    }

    /* Single Post Display */
    .single-post {
      margin-bottom: 30px;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .author-tag {
      display: inline;
      margin-right: 6px;
      background-color: #ffff00;
      color: #000000;
      text-decoration: none;
      padding: 2px 4px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title {
      display: inline;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .post-date {
      color: #888888;
      font-weight: normal;
      font-size: 11px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: normal;
      cursor: pointer;
      margin-left: 8px;
      padding: 0;
      text-decoration: none;
    }

    .delete-btn:hover {
      text-decoration: underline;
    }

    .full-post-image {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
      margin: 15px 0;
    }

    .post-text-content {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 30px;
      white-space: pre-wrap;
    }

    /* Comments Section */
    .comments-section {
      border-top: 1px solid #eeeeee;
      padding-top: 25px;
      margin-top: 30px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .comments-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }

    .comment {
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #eee;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .comment-timestamp {
      font-size: 11px;
      color: #888888;
      font-family: monospace;
    }

    .comment-body {
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .add-comment-form {
      margin-top: 20px;
    }

    .add-comment-form input[type="text"],
    .add-comment-form textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #000000;
      outline: none;
    }

    .add-comment-form input[type="text"]::placeholder,
    .add-comment-form textarea::placeholder {
      color: #777777;
    }

    .add-comment-form button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="site-wrapper">
    <div class="content-left">
      <a href="index.html" class="logo">faapd</a>
      
      <main id="post-content">Loading post...</main>

      <section class="comments-section">
        <h3>Comments</h3>
        <div id="comments-list"></div>

        <div class="add-comment-form">
          <input type="text" id="comment-author" placeholder="Your Name" required>
          <textarea id="comment-text" rows="3" placeholder="Leave a comment..." required></textarea>
          <button onclick="addComment()">Submit Comment</button>
        </div>
      </section>
    </div>

    <aside>
      <ul class="nav-list">
        <li><a href="about.html">ABOUT</a></li>
      </ul>

      <ul class="author-key">
        <li><a href="franklinabboud.html">Franklin Abboud</a></li>
        <li><a href="patrickdaughety.html">Patrick Daughety</a></li>
      </ul>
    </aside>
  </div>

  <script src="posts.js"></script>

  <script>
    const ADMIN_PIN = "1234";

    const params = new URLSearchParams(window.location.search);
    const postFile = params.get('file');
    const postId = params.get('id') || postFile;

    async function loadPost() {
      const container = document.getElementById('post-content');

      // 1. Check local/static storage first
      const localPosts = JSON.parse(localStorage.getItem('custom_posts')) || [];
      const staticPosts = (typeof postsData !== 'undefined') ? postsData : [];
      let foundPost = [...localPosts, ...staticPosts].find(p => p.id == postId || p.url === `posts/${postFile}`);

      if (foundPost) {
        renderSinglePost(foundPost);
        return;
      }

      // 2. Otherwise fetch raw file from GitHub /posts/ directory
      if (postFile) {
        try {
          const res = await fetch(`posts/${postFile}`);
          if (!res.ok) throw new Error("File not found");
          const htmlText = await res.text();

          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          const author = doc.querySelector('.author-tag')?.textContent?.trim() || "FRANKLIN ABBOUD";
          const title = doc.querySelector('.post-title')?.textContent?.trim() || postFile.replace('.html', '').replace(/-/g, ' ').toUpperCase();
          const timestamp = doc.querySelector('.post-date')?.textContent?.trim() || '';
          const imageSrc = doc.querySelector('.full-post-image, .post-thumb, img')?.getAttribute('src') || '';
          const bodyText = doc.querySelector('.post-text-content, .post-text, p')?.textContent?.trim() || '';

          renderSinglePost({
            author: author,
            title: title,
            dateStr: timestamp,
            image: imageSrc,
            text: bodyText
          });
        } catch (e) {
          container.innerHTML = `<p>Post not found.</p>`;
        }
      } else {
        container.innerHTML = `<p>Post not found.</p>`;
      }
    }

    function renderSinglePost(p) {
      const imageTag = p.image ? `<img src="${p.image}" alt="${p.title}" class="full-post-image">` : '';
      
      document.getElementById('post-content').innerHTML = `
        <article class="single-post">
          <div class="post-header">
            <span class="author-tag">${p.author}</span>
            <span class="post-title">${p.title}</span>
            <span class="post-date">${p.dateStr || ''}</span>
          </div>
          ${imageTag}
          <div class="post-text-content">
            <p>${p.text}</p>
          </div>
        </article>
      `;
    }

    /* Comments Section */
    function getCurrentTimestamp() {
      const now = new Date();
      const date = now.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' }).replace(/\//g, '.');
      const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      return `${date} @ ${time}`;
    }

    function loadComments() {
      const savedComments = JSON.parse(localStorage.getItem(`comments_${postId}`)) || [];
      const commentsList = document.getElementById('comments-list');
      
      if (savedComments.length === 0) {
        commentsList.innerHTML = `<p style="font-size:11px; color:#888;"><em>No comments yet.</em></p>`;
        return;
      }

      commentsList.innerHTML = savedComments.map(c => `
        <div class="comment">
          <div class="comment-header">
            <strong>${c.author}</strong>
            <span class="comment-timestamp">${c.timestamp || ''}</span>
          </div>
          <p class="comment-body">${c.text}</p>
        </div>
      `).join('');
    }

    function addComment() {
      const author = document.getElementById('comment-author').value.trim();
      const text = document.getElementById('comment-text').value.trim();

      if (!author || !text) {
        alert('Please fill out both fields.');
        return;
      }

      const newComment = {
        author: author,
        text: text,
        timestamp: getCurrentTimestamp()
      };

      const savedComments = JSON.parse(localStorage.getItem(`comments_${postId}`)) || [];
      savedComments.push(newComment);
      
      localStorage.setItem(`comments_${postId}`, JSON.stringify(savedComments));

      document.getElementById('comment-author').value = '';
      document.getElementById('comment-text').value = '';
      loadComments();
    }

    loadPost();
    loadComments();
  </script>
</body>
</html>
