<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    /* Specific styles for the Author Profile Page */
    .author-title {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .social-links {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      margin-bottom: 30px;
    }

    .social-links a {
      color: #000000;
      text-decoration: underline;
      margin-right: 12px;
    }
  </style>
</head>
<body>

  <!-- Layout Container -->
  <div id="layout-container"></div>

  <!-- Content Template for Franklin Abboud -->
  <template id="author-content">
    <div class="author-title">Franklin Abboud</div>
    <div class="social-links">
      <a href="https://youtube.com/@djmodelfrankfamouspunk4" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://soundcloud.com/djmodelfrankfamouspunk4" target="_blank" rel="noopener noreferrer">SoundCloud</a>
      <a href="https://github.com/famouspunk4" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </template>

  <script>
    // Fetch and inject layout.html
    fetch('layout.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('layout-container').innerHTML = html;

        // Inject page content into main-content container
        const content = document.getElementById('author-content').content.cloneNode(true);
        document.getElementById('main-content').appendChild(content);
      })
      .catch(err => console.error('Error loading layout:', err));
  </script>
</body>
</html>
