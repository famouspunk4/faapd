<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd - Patrick Daughety</title>

  <style>
    /* Specific styles for the Author Profile Page */
    .author-title {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .social-links {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      margin-bottom: 30px;
    }

    .social-links a {
      color: #000000;
      text-decoration: underline;
      margin-right: 12px;
    }

    /* Feed Layout */
    .post {
      margin-bottom: 35px;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .author-tag {
      background-color: #ffff00;
      color: #000000;
      padding: 1px 4px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title a {
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      margin-left: 6px;
      text-transform: uppercase;
    }

    .post-title a:hover {
      text-decoration: underline;
    }

    .post-date {
      color: #666666;
      margin-left: 6px;
    }

    .post-body {
      display: flex;
      gap: 15px;
    }

    .post-thumb {
      width: 120px;
      height: 120px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .post-text {
      flex: 1;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid #000000;
      padding: 25px;
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .modal-box h3 {
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .modal-box input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .modal-actions button.cancel-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
    }

    @media (max-width: 768px) {
      .post-body {
        flex-direction: column;
        gap: 10px;
      }

      .post-thumb {
        width: 100%;
        height: auto;
        max-height: 300px;
      }
    }
  </style>
</head>
<body>

  <!-- Layout Container -->
  <div id="layout-container"></div>

  <!-- Content Template for Patrick Daughety -->
  <template id="author-content">
    <div class="author-title">Patrick Daughety</div>
    <div class="social-links">
      <a href="https://youtube.com/@poleo200?si=n4CTVVwTpRQxzDjq" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://soundcloud.com/19patrick?utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing" target="_blank" rel="noopener noreferrer">SoundCloud</a>
      <a href="https://github.com/4runner4ever" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>

    <div id="author-feed"></div>
  </template>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>Account Login</h3>
      <input type="password" id="modal-passcode" placeholder="Enter Passcode" />
      <div class="modal-actions">
        <button class="cancel-btn" id="modal-cancel">Cancel</button>
        <button id="modal-submit">Enter</button>
      </div>
    </div>
  </div>

  <script src="posts.js"></script>
  <script>
    // Fetch and inject layout.html
    fetch('layout.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('layout-container').innerHTML = html;

        // Inject page content into main-content container
        const content = document.getElementById('author-content').content.cloneNode(true);
        document.getElementById('main-content').appendChild(content);

        initModalEvents();
        loadAuthorFeed();
      })
      .catch(err => console.error('Error loading layout:', err));

    function initModalEvents() {
      const accountIconBtn = document.getElementById('account-icon-btn');
      const loginModal = document.getElementById('login-modal');
      const modalCancel = document.getElementById('modal-cancel');
      const modalSubmit = document.getElementById('modal-submit');
      const modalPasscode = document.getElementById('modal-passcode');

      if (accountIconBtn) {
        accountIconBtn.addEventListener('click', (e) => {
          e.preventDefault();
          loginModal.style.display = 'flex';
          modalPasscode.focus();
        });
      }

      modalCancel.addEventListener('click', () => {
        loginModal.style.display = 'none';
        modalPasscode.value = '';
      });

      modalSubmit.addEventListener('click', handleLogin);
      modalPasscode.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
      });

      function handleLogin() {
        if (modalPasscode.value.trim() !== '') {
          loginModal.style.display = 'none';
          window.location.href = 'create.html';
        } else {
          alert('Please enter a passcode.');
        }
      }
    }

    function loadAuthorFeed() {
      const feedContainer = document.getElementById('author-feed');
      if (!feedContainer) return;

      const TARGET_AUTHOR = "Patrick Daughety";

      const localPosts = JSON.parse(localStorage.getItem('custom_posts')) || [];
      const staticPosts = (typeof postsData !== 'undefined') ? postsData : [];
      const allPosts = [...localPosts.slice().reverse(), ...staticPosts];

      const authorPosts = allPosts.filter(p => p.author && p.author.toLowerCase() === TARGET_AUTHOR.toLowerCase());

      if (authorPosts.length === 0) {
        feedContainer.innerHTML = "<p style='font-family: Arial; font-size: 11px;'>No posts found.</p>";
      } else {
        let authorFeedHtml = '';

        authorPosts.forEach(post => {
          const d = new Date(post.date);
          const formattedDate = d.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' }).replace(/\//g, '.');
          const formattedTime = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          authorFeedHtml += `
            <article class="post">
              <div class="post-header">
                <span class="author-tag">${post.author}</span>
                <span class="post-title"><a href="post.html?id=${post.id}">${post.title}</a></span>
                <span class="post-date">${formattedDate} @ ${formattedTime}</span>
              </div>
              <div class="post-body">
                ${post.image ? `<img src="${post.image}" alt="Thumbnail" class="post-thumb" />` : ''}
                <div class="post-text"><p>${post.text || ''}</p></div>
              </div>
            </article>
          `;
        });

        feedContainer.innerHTML = authorFeedHtml;
      }
    }
  </script>
</body>
</html>
