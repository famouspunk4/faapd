<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
      position: relative;
    }

    /* Top Right Human Silhouette Icon */
    .user-account-icon {
      position: absolute;
      top: 35px;
      right: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      transition: opacity 0.2s ease;
    }

    .user-account-icon:hover {
      opacity: 0.6;
    }

    .user-account-icon svg {
      width: 24px;
      height: 24px;
      fill: #000000;
    }

    .site-wrapper {
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      padding: 0 40px;
    }

    .content-left {
      max-width: 580px;
      width: 100%;
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      display: block;
      margin-bottom: 25px;
    }
    
    /* Right Section: Navigation Directory */
    aside {
      width: 140px;
      flex-shrink: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      margin-top: 250px;
      margin-right: 60px;
    }

    .nav-list {
      list-style: none;
      margin-bottom: 30px;
    }

    .nav-list li {
      margin-bottom: 6px;
    }

    .nav-list a {
      color: #000000;
      text-decoration: underline;
    }

    .nav-list a:hover {
      background-color: #ffff00;
    }

    .author-key {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 10px;
      color: #555555;
      line-height: 1.4;
    }

    .author-key li {
      margin-bottom: 4px;
    }

    .author-key a {
      color: #555555;
      text-decoration: none;
    }

    .author-key a:hover {
      text-decoration: underline;
    }

    .feed-item {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eeeeee;
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .author-tag {
      display: inline-block;
      margin-right: 6px;
      background-color: #ffff00;
      color: #000000;
      text-decoration: none;
      padding: 0 2px;
      line-height: 1.1;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title {
      display: inline;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .post-title a {
      color: #000000;
      text-decoration: none;
    }

    .post-title a:hover {
      text-decoration: underline;
    }

    .post-date {
      color: #888888;
      font-weight: normal;
      font-size: 11px;
    }

    /* Row forces strict top alignment */
    .post-content-row {
      display: flex !important;
      align-items: flex-start !important;
      justify-content: flex-start !important;
      gap: 15px !important;
      margin-top: 10px !important;
    }

    .post-thumb {
      width: 120px !important;
      height: auto !important;
      flex-shrink: 0 !important;
      display: block !important;
      align-self: flex-start !important;
      margin: 0 !important;
    }

    .post-text-content {
      font-size: 13px !important;
      line-height: 1.3 !important;
      flex-grow: 1 !important;
      margin: 0 !important;
      padding: 0 !important;
      align-self: flex-start !important;
      white-space: pre-wrap !important;
    }

    .post-text-content p {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.3 !important;
      display: block !important;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid #000000;
      padding: 25px;
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .modal-box h3 {
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .modal-box input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .modal-actions button.cancel-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
    }
  </style>
</head>
<body>

  <!-- Top Right Human Silhouette Icon Link -->
  <a id="account-icon-btn" class="user-account-icon" title="Account Login">
    <svg viewBox="0 0 24 24">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
    </svg>
  </a>

  <div class="site-wrapper">
    <div class="content-left">
      <a href="index.html" class="logo">faapd</a>
      <main id="feed-container">Loading feed...</main>
    </div>

    <aside>
      <ul class="nav-list">
        <li><a href="about.html">ABOUT</a></li>
      </ul>

      <!-- Author links passing URL parameters for filtering -->
      <ul class="author-key">
        <li><a href="index.html?author=FRANKLIN%20ABBOUD">Franklin Abboud</a></li>
        <li><a href="index.html?author=PATRICK%20DAUGHETY">Patrick Daughety</a></li>
      </ul>
    </aside>
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>Account Login</h3>
      <input type="password" id="modal-passcode" placeholder="Enter Passcode" />
      <div class="modal-actions">
        <button class="cancel-btn" id="modal-cancel">Cancel</button>
        <button id="modal-submit">Enter</button>
      </div>
    </div>
  </div>

  <script src="posts.js"></script>

  <script>
    // Modal controls connected to top-right icon
    const accountIconBtn = document.getElementById('account-icon-btn');
    const loginModal = document.getElementById('login-modal');
    const modalCancel = document.getElementById('modal-cancel');
    const modalSubmit = document.getElementById('modal-submit');
    const modalPasscode = document.getElementById('modal-passcode');

    accountIconBtn.addEventListener('click', (e) => {
      e.preventDefault();
      loginModal.style.display = 'flex';
      modalPasscode.focus();
    });

    modalCancel.addEventListener('click', () => {
      loginModal.style.display = 'none';
      modalPasscode.value = '';
    });

    modalSubmit.addEventListener('click', handleLogin);
    modalPasscode.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    function handleLogin() {
      if (modalPasscode.value.trim() !== '') {
        loginModal.style.display = 'none';
        window.location.href = 'create.html';
      } else {
        alert('Please enter a passcode.');
      }
    }

    async function loadFeed() {
      const container = document.getElementById('feed-container');

      const urlParams = new URLSearchParams(window.location.search);
      const selectedAuthor = urlParams.get('author');

      const localPosts = JSON.parse(localStorage.getItem('custom_posts')) || [];
      const staticPosts = (typeof postsData !== 'undefined') ? postsData : [];
      let allPosts = [...localPosts, ...staticPosts];

      try {
        const response = await fetch('https://api.github.com/repos/famouspunk4/faapd/contents/posts');
        if (response.ok) {
          const files = await response.json();
          const htmlFiles = files.filter(f => f.name.endsWith('.html'));

          htmlFiles.sort((a, b) => b.name.localeCompare(a.name));

          const fetchedPosts = await Promise.all(htmlFiles.map(async (file) => {
            const res = await fetch(file.download_url);
            const htmlText = await res.text();
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            const textContainer = doc.querySelector('.post-text-content');
            const extractedText = textContainer ? textContainer.innerHTML.trim() : (doc.querySelector('p')?.innerHTML?.trim() || '');

            return {
              filename: file.name,
              author: doc.querySelector('.author-tag')?.textContent?.trim() || 'FRANKLIN ABBOUD',
              title: doc.querySelector('.post-title')?.textContent?.trim() || file.name.replace('.html', '').replace(/-/g, ' ').toUpperCase(),
              dateStr: doc.querySelector('.post-date')?.textContent?.trim() || '',
              image: doc.querySelector('.full-post-image, .post-thumb, img')?.getAttribute('src') || '',
              htmlText: extractedText
            };
          }));

          allPosts = [...fetchedPosts, ...allPosts];
        }
      } catch (err) {
        console.error("Could not fetch remote GitHub posts:", err);
      }

      if (selectedAuthor) {
        allPosts = allPosts.filter(post => {
          return post.author && post.author.toUpperCase() === selectedAuthor.toUpperCase();
        });
      }

      renderFeed(allPosts);
    }

    function renderFeed(posts) {
      const container = document.getElementById('feed-container');
      
      if (!posts || posts.length === 0) {
        container.innerHTML = `<p style="font-size:11px; color:#888;">No posts found.</p>`;
        return;
      }

      container.innerHTML = posts.map(post => {
        const targetUrl = post.filename ? `post.html?file=${post.filename}` : `post.html?id=${post.id}`;
        const imageTag = post.image ? `<img src="${post.image}" alt="${post.title}" class="post-thumb" style="width:120px; height:auto; display:block; align-self:flex-start; margin:0; flex-shrink:0;">` : '';
        const bodyContent = post.htmlText || `<p>${post.text || ''}</p>`;

        return `
          <article class="feed-item">
            <div class="post-header">
              <a href="index.html?author=${encodeURIComponent(post.author)}" class="author-tag">${post.author}</a>
              <span class="post-title"><a href="${targetUrl}">${post.title}</a></span>
              <span class="post-date">${post.dateStr || post.date || ''}</span>
            </div>
            <div class="post-content-row" style="display:flex; align-items:flex-start; justify-content:flex-start; gap:15px; margin-top:10px;">
              ${imageTag}
              <div class="post-text-content" style="font-size:13px; line-height:1.3; flex-grow:1; align-self:flex-start; margin:0; padding:0; white-space:pre-wrap;">
                ${bodyContent}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    loadFeed();
  </script>
</body>
</html>
