<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .site-wrapper {
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      padding: 0 40px;
    }

    /* Left Section: Main Feed */
    .content-left {
      max-width: 580px;
      width: 100%;
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 26px;
      color: #000000;
      text-decoration: none;
      display: block;
      margin-bottom: 25px;
    }

    /* Right Section: Sidebar Navigation */
    aside {
      width: 140px;
      flex-shrink: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      margin-top: 250px;
      margin-right: 60px;
    }

    .nav-list {
      list-style: none;
      margin-bottom: 30px;
      padding: 0;
    }

    .nav-list li {
      margin-bottom: 6px;
    }

    .nav-list a {
      color: #000000;
      text-decoration: underline;
    }

    .nav-list a:hover {
      background-color: #ffff00;
    }

    .author-key {
      font-size: 10px;
      color: #555555;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .author-key li {
      margin-bottom: 6px;
      list-style: none;
    }

    .author-key a {
      color: #000000;
      text-decoration: none;
    }

    .author-key a:hover {
      text-decoration: underline;
      background-color: transparent;
    }

    /* Post Feed Layout */
    .feed-item {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eeeeee;
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Highlight tightly hugging the text */
    .author-tag {
      display: inline-block;
      margin-right: 6px;
      background-color: #ffff00;
      color: #000000;
      text-decoration: none;
      padding: 0 2px;
      line-height: 1.1;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title {
      display: inline;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .post-title a {
      color: #000000;
      text-decoration: none;
    }

    .post-title a:hover {
      text-decoration: underline;
    }

    .post-date {
      color: #888888;
      font-weight: normal;
      font-size: 11px;
    }

    /* Side-by-Side Layout Starting At Top Edge */
    .post-content-row {
      display: flex !important;
      align-items: flex-start !important;
      gap: 15px !important;
      margin-top: 10px !important;
    }

    .post-thumb {
      width: 120px !important;
      height: auto !important;
      flex-shrink: 0 !important;
      display: block !important;
    }

    .post-text-content {
      font-size: 13px !important;
      flex-grow: 1 !important;
      white-space: pre-wrap !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Strips default browser top-margin from <p> */
    .post-text-content p {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.2 !important;
    }
  </style>
</head>
<body>

  <div class="site-wrapper">
    <!-- Left Column: Feed -->
    <div class="content-left">
      <a href="index.html" class="logo">faapd</a>
      <main id="feed-container">Loading feed...</main>
    </div>

    <!-- Right Column: Sidebar Navigation -->
    <aside>
      <ul class="nav-list">
        <li><a href="about.html">ABOUT</a></li>
      </ul>

      <ul class="author-key">
        <li><a href="franklinabboud.html">Franklin Abboud</a></li>
        <li><a href="patrickdaughety.html">Patrick Daughety</a></li>
      </ul>
    </aside>
  </div>

  <script src="posts.js"></script>

  <script>
    async function loadFeed() {
      const container = document.getElementById('feed-container');

      // 1. Fetch static or stored posts if available
      const localPosts = JSON.parse(localStorage.getItem('custom_posts')) || [];
      const staticPosts = (typeof postsData !== 'undefined') ? postsData : [];
      let allPosts = [...localPosts, ...staticPosts];

      if (allPosts.length > 0) {
        renderFeed(allPosts);
        return;
      }

      // 2. Fallback fetch from posts directory
      try {
        const response = await fetch('https://api.github.com/repos/famouspunk4/faapd/contents/posts');
        if (!response.ok) throw new Error('Unable to fetch posts');
        
        const files = await response.json();
        const htmlFiles = files.filter(f => f.name.endsWith('.html'));

        // Sort filenames descending so newest timestamped files come first
        htmlFiles.sort((a, b) => b.name.localeCompare(a.name));

        const fetchedPosts = await Promise.all(htmlFiles.map(async (file) => {
          const res = await fetch(file.download_url);
          const htmlText = await res.text();
          
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          return {
            filename: file.name,
            author: doc.querySelector('.author-tag')?.textContent?.trim() || 'FRANKLIN ABBOUD',
            title: doc.querySelector('.post-title')?.textContent?.trim() || file.name.replace('.html', '').replace(/-/g, ' ').toUpperCase(),
            dateStr: doc.querySelector('.post-date')?.textContent?.trim() || '',
            image: doc.querySelector('.full-post-image, .post-thumb, img')?.getAttribute('src') || '',
            text: doc.querySelector('.post-text-content, .post-text, p')?.textContent?.trim() || ''
          };
        }));

        renderFeed(fetchedPosts);
      } catch (err) {
        container.innerHTML = `<p style="font-size:11px; color:#888;">No posts found.</p>`;
      }
    }

    function renderFeed(posts) {
      const container = document.getElementById('feed-container');
      
      if (!posts || posts.length === 0) {
        container.innerHTML = `<p style="font-size:11px; color:#888;">No posts available.</p>`;
        return;
      }

      container.innerHTML = posts.map(post => {
        const targetUrl = post.filename ? `post.html?file=${post.filename}` : `post.html?id=${post.id}`;
        const imageTag = post.image ? `<img src="${post.image}" alt="${post.title}" class="post-thumb">` : '';

        return `
          <article class="feed-item">
            <div class="post-header">
              <span class="author-tag">${post.author}</span>
              <span class="post-title"><a href="${targetUrl}">${post.title}</a></span>
              <span class="post-date">${post.dateStr || post.date || ''}</span>
            </div>
            <div class="post-content-row">
              ${imageTag}
              <div class="post-text-content">
                <p>${post.text}</p>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    loadFeed();
  </script>
</body>
</html>
