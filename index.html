<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>
  <style>
    /* Feed specific styles */
    .feed-item {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eeeeee;
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .post-header {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .author-tag {
      display: inline-block;
      margin-right: 6px;
      background-color: #ffff00;
      color: #000000;
      text-decoration: none;
      padding: 0 2px;
      line-height: 1.1;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-title {
      display: inline;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .post-title a {
      color: #000000;
      text-decoration: none;
    }

    .post-title a:hover {
      text-decoration: underline;
    }

    .post-date {
      color: #888888;
      font-weight: normal;
      font-size: 11px;
    }

    .post-content-row {
      display: flex !important;
      align-items: flex-start !important;
      justify-content: flex-start !important;
      gap: 15px !important;
      margin-top: 10px !important;
    }

    .post-thumb {
      width: 120px !important;
      height: auto !important;
      flex-shrink: 0 !important;
      display: block !important;
      align-self: flex-start !important;
      margin: 0 !important;
    }

    .post-text-content {
      font-size: 13px !important;
      line-height: 1.3 !important;
      flex-grow: 1 !important;
      margin: 0 !important;
      padding: 0 !important;
      align-self: flex-start !important;
      white-space: pre-wrap !important;
    }

    .post-text-content p {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.3 !important;
      display: inline !important;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid #000000;
      padding: 25px;
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .modal-box h3 {
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .modal-box input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .modal-actions button.cancel-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
    }
  </style>
</head>
<body>

  <!-- Container for the shared layout shell -->
  <div id="layout-container"></div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>Account Login</h3>
      <input type="password" id="modal-passcode" placeholder="Enter Passcode" />
      <div class="modal-actions">
        <button class="cancel-btn" id="modal-cancel">Cancel</button>
        <button id="modal-submit">Enter</button>
      </div>
    </div>
  </div>

  <script src="posts.js"></script>

  <script>
    // 1. Fetch and inject layout.html
    fetch('layout.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('layout-container').innerHTML = html;
        initModalEvents();
        loadFeed();
      })
      .catch(err => console.error('Error loading layout:', err));

    // 2. Setup account modal controls
    function initModalEvents() {
      const accountIconBtn = document.getElementById('account-icon-btn');
      const loginModal = document.getElementById('login-modal');
      const modalCancel = document.getElementById('modal-cancel');
      const modalSubmit = document.getElementById('modal-submit');
      const modalPasscode = document.getElementById('modal-passcode');

      if (accountIconBtn) {
        accountIconBtn.addEventListener('click', (e) => {
          e.preventDefault();
          loginModal.style.display = 'flex';
          modalPasscode.focus();
        });
      }

      modalCancel.addEventListener('click', () => {
        loginModal.style.display = 'none';
        modalPasscode.value = '';
      });

      modalSubmit.addEventListener('click', handleLogin);
      modalPasscode.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
      });

      function handleLogin() {
        if (modalPasscode.value.trim() !== '') {
          loginModal.style.display = 'none';
          window.location.href = 'create.html';
        } else {
          alert('Please enter a passcode.');
        }
      }
    }

    // 3. Load dynamic post feed into main-content container
    async function loadFeed() {
      const container = document.getElementById('main-content');
      if (!container) return;
      container.innerHTML = 'Loading feed...';

      const urlParams = new URLSearchParams(window.location.search);
      const selectedAuthor = urlParams.get('author');

      const localPosts = JSON.parse(localStorage.getItem('custom_posts')) || [];
      const staticPosts = (typeof postsData !== 'undefined') ? postsData : [];
      let allPosts = [...localPosts, ...staticPosts];

      try {
        const response = await fetch('https://api.github.com/repos/famouspunk4/faapd/contents/posts');
        if (response.ok) {
          const files = await response.json();
          const htmlFiles = files.filter(f => f.name.endsWith('.html'));

          htmlFiles.sort((a, b) => b.name.localeCompare(a.name));

          const fetchedPosts = await Promise.all(htmlFiles.map(async (file) => {
            const res = await fetch(file.download_url);
            const htmlText = await res.text();
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            const textContainer = doc.querySelector('.post-text-content');
            let extractedText = textContainer ? textContainer.innerHTML.trim() : (doc.querySelector('p')?.innerHTML?.trim() || '');
            
            extractedText = extractedText.replace(/^<p[^>]*>/i, '').replace(/<\/p>$/i, '').trim();

            return {
              filename: file.name,
              author: doc.querySelector('.author-tag')?.textContent?.trim() || 'FRANKLIN ABBOUD',
              title: doc.querySelector('.post-title')?.textContent?.trim() || file.name.replace('.html', '').replace(/-/g, ' ').toUpperCase(),
              dateStr: doc.querySelector('.post-date')?.textContent?.trim() || '',
              image: doc.querySelector('.full-post-image, .post-thumb, img')?.getAttribute('src') || '',
              htmlText: extractedText
            };
          }));

          allPosts = [...fetchedPosts, ...allPosts];
        }
      } catch (err) {
        console.error("Could not fetch remote GitHub posts:", err);
      }

      if (selectedAuthor) {
        allPosts = allPosts.filter(post => {
          return post.author && post.author.toUpperCase() === selectedAuthor.toUpperCase();
        });
      }

      renderFeed(allPosts);
    }

    function renderFeed(posts) {
      const container = document.getElementById('main-content');
      
      if (!posts || posts.length === 0) {
        container.innerHTML = `<p style="font-size:11px; color:#888;">No posts found.</p>`;
        return;
      }

      container.innerHTML = posts.map(post => {
        const targetUrl = post.filename ? `post.html?file=${post.filename}` : `post.html?id=${post.id}`;
        const imageTag = post.image ? `<img src="${post.image}" alt="${post.title}" class="post-thumb">` : '';
        const bodyContent = post.htmlText || post.text || '';

        return `
          <article class="feed-item">
            <div class="post-header">
              <a href="index.html?author=${encodeURIComponent(post.author)}" class="author-tag">${post.author}</a>
              <span class="post-title"><a href="${targetUrl}">${post.title}</a></span>
              <span class="post-date">${post.dateStr || post.date || ''}</span>
            </div>
            <div class="post-content-row">
              ${imageTag}
              <div class="post-text-content">${bodyContent}</div>
            </div>
          </article>
        `;
      }).join('');
    }
  </script>
</body>
</html>
