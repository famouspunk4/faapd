<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faapd</title>

  <style>
    /* Specific styles for the Games thumbnail grid */
    .games-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .game-card {
      display: block;
      width: 280px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .game-card:hover {
      opacity: 0.85;
    }

    .game-thumb {
      width: 100%;
      height: auto;
      display: block;
      border: 1px dashed #000000;
    }

    /* Account Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid #000000;
      padding: 25px;
      width: 300px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .modal-box h3 {
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .modal-box input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .modal-actions button.cancel-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
    }
  </style>
</head>
<body>

  <!-- Layout Container -->
  <div id="layout-container"></div>

  <!-- Content Template for Games -->
  <template id="games-content">
    <div class="games-grid">
      <!-- Game Card 1 -->
      <a href="zonbikillaz.html" class="game-card">
        <img src="zonbikillaz.png" alt="ZONBI KILLAZ 2026" class="game-thumb" />
      </a>
    </div>
  </template>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>Account Login</h3>
      <input type="password" id="modal-passcode" placeholder="Enter Passcode" />
      <div class="modal-actions">
        <button class="cancel-btn" id="modal-cancel">Cancel</button>
        <button id="modal-submit">Enter</button>
      </div>
    </div>
  </div>

  <script>
    // Fetch and load layout.html shell
    fetch('layout.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('layout-container').innerHTML = html;
        
        // Inject games content into main-content container
        const content = document.getElementById('games-content').content.cloneNode(true);
        document.getElementById('main-content').appendChild(content);

        initModalEvents();
      })
      .catch(err => console.error('Error loading layout:', err));

    function initModalEvents() {
      const accountIconBtn = document.getElementById('account-icon-btn');
      const loginModal = document.getElementById('login-modal');
      const modalCancel = document.getElementById('modal-cancel');
      const modalSubmit = document.getElementById('modal-submit');
      const modalPasscode = document.getElementById('modal-passcode');

      if (accountIconBtn) {
        accountIconBtn.addEventListener('click', (e) => {
          e.preventDefault();
          loginModal.style.display = 'flex';
          modalPasscode.focus();
        });
      }

      modalCancel.addEventListener('click', () => {
        loginModal.style.display = 'none';
        modalPasscode.value = '';
      });

      modalSubmit.addEventListener('click', handleLogin);
      modalPasscode.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
      });

      function handleLogin() {
        if (modalPasscode.value.trim() !== '') {
          loginModal.style.display = 'none';
          window.location.href = 'create.html';
        } else {
          alert('Please enter a passcode.');
        }
      }
    }
  </script>
</body>
</html>
